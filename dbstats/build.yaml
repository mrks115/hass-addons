---
# ghcr.io/home-assistant/base is the officially maintained HA add-on base
# image (includes s6-overlay + bashio) and, since 2026.03.1, is published as
# a single multi-arch manifest, so the same tag works for every architecture.
# Alpine 3.24 ships Node.js 24.x via apk, matching this app's engines (^24).
build_from:
  aarch64: ghcr.io/home-assistant/base:3.24
  amd64: ghcr.io/home-assistant/base:3.24
  armv7: ghcr.io/home-assistant/base:3.24
